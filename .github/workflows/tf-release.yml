---
#
# PLEASE NOTE: Managed workflow - do not change manually
#
name: Release

on:
  workflow_dispatch:
    inputs:
      dryRun:
        type: boolean
        description: "Dry-Run"
        default: false
      skipCheck:
        type: boolean
        description: "Skip checks/tests"
        default: false
      reAddReverted:
        type: boolean
        description: "Re-add reverted changes (only for releases from non-default branches)"
        default: true

concurrency:
  # releases from any branch (incl. partial releases) run one at a time,
  # so they can't compute the same version concurrently
  group: release-refs/heads/${{ github.event.repository.default_branch }}

jobs:
  publish:
    # Only on main repository (don't release on forks)
    if: github.repository_owner == 'wetransform-os'

    concurrency:
      # only run one publishing per branch at a time to avoid conflicts (shared with the Publish workflow)
      group: publish-${{ github.ref }}

    uses: wetransform/gha-workflows/.github/workflows/gradle-library-publish.yml@7971851395511ca7b1f5dbaea1835d9253f18388 # v4.7.1
    with:
      semantic-release-dryrun: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun || false }}
      skip-check: ${{ github.event_name == 'workflow_dispatch' && inputs.skipCheck || false }}
      partial-release-readd: ${{ github.event_name != 'workflow_dispatch' || inputs.reAddReverted }}
      multi-module: false
      semantic-release: true
      skip-scan: false
    secrets:
      WETF_ARTIFACTORY_USER: ${{ secrets.WETF_ARTIFACTORY_USER }}
      WETF_ARTIFACTORY_PASSWORD: ${{ secrets.WETF_ARTIFACTORY_PASSWORD }}
      SLACK_NOTIFICATIONS_BOT_TOKEN: ${{ secrets.SLACK_NOTIFICATIONS_BOT_TOKEN }}
      WE_RELEASE_GITHUB_APP_ID: ${{ secrets.WE_RELEASE_GITHUB_APP_ID }}
      WE_RELEASE_GITHUB_PRIVATE_KEY: ${{ secrets.WE_RELEASE_GITHUB_PRIVATE_KEY }}
